<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Морской бой — по сети</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>⚓ Морской бой</h1>
      <p class="subtitle">многопользовательская игра в реальном времени (WebSockets)</p>
    </header>

    <section id="authPanel" class="panel">
      <h3>Авторизация</h3>
      <div id="authForm">
        <div class="authRow">
          <input id="usernameInput" type="text" maxlength="20" placeholder="Логин" autocomplete="off">
          <input id="passwordInput" type="password" maxlength="64" placeholder="Пароль" autocomplete="off">
          <button id="loginBtn">Войти</button>
          <button id="registerBtn" class="secondary">Регистрация</button>
        </div>
        <p id="authStatus" class="status muted"></p>
      </div>
      <div id="authInfo" class="hidden">
        <span>Вы вошли как <b id="authUser"></b></span>
        <button id="logoutBtn" class="secondary">Выйти</button>
      </div>
    </section>

    <section id="resultsPanel" class="panel hidden">
      <h3>Ваши результаты</h3>
      <div id="resultsSummary" class="resultsSummary"></div>
      <table id="resultsTable">
        <thead>
          <tr><th>#</th><th>Дата</th><th>Соперник</th><th>Результат</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="resultsEmpty" class="muted hidden">Пока нет сыгранных партий.</p>
    </section>

    <section id="connectPanel" class="panel">
      <label for="nameInput">Ваше имя:</label>
      <input id="nameInput" type="text" maxlength="20" placeholder="Игрок" autocomplete="off">
      <button id="connectBtn">Подключиться</button>
      <p id="connStatus" class="status muted">Не подключено</p>
    </section>

    <section id="gamePanel" class="panel hidden">
      <div class="statusRow">
        <div id="gameStatus" class="status"></div>
        <button id="restartBtn" class="hidden">Играть ещё раз</button>
      </div>

      <div class="boards">
        <div class="boardCol">
          <h2 id="yourTitle">Ваше поле</h2>
          <div id="yourBoard" class="board"></div>
          <div class="shipInfo">Ваши корабли: <b id="yourShips">—</b></div>
        </div>
        <div class="boardCol">
          <h2 id="enemyTitle">Поле противника</h2>
          <div id="enemyBoard" class="board"></div>
          <div class="shipInfo">Корабли противника: <b id="enemyShips">—</b></div>
        </div>
      </div>

      <div class="logWrap">
        <h3>Журнал боя</h3>
        <div id="log" class="log"></div>
      </div>
    </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
